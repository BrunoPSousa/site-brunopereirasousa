<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PPD26 - Grelha</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="theme-color" content="#ff3eb5"><link rel="stylesheet" href="theme.css?v=20261017-compact-mobile-header"></head><body class="shell"><nav aria-label="Navegação da grelha"><div class="brand"><span class="brand-name">Porto/Post/Doc 2026</span><span class="brand-bird" role="img" aria-label="Pássaro da edição 2026 do Porto/Post/Doc"></span></div><button type="button" id="viewToggle" class="shell-title" aria-label="Mudar para grelha por dia">GRELHA <span>POR SALA</span></button><div class="room-buttons" id="roomButtons"><button data-room="bcc1">BCC1</button><button data-room="bcc2">BCC2</button><button data-room="bcchl">BCC HL</button><button data-room="tmmcn">TMMCN</button><button data-room="plnt">PLNT</button><button data-room="passos">PM</button></div><div class="day-buttons" id="dayButtons" hidden></div></nav><iframe id="map" title="Mapa de sessões"></iframe><script>
const frame=document.getElementById('map'),toggle=document.getElementById('viewToggle'),roomButtons=document.getElementById('roomButtons'),dayButtons=document.getElementById('dayButtons'),rooms=['bcc1','bcc2','bcchl','tmmcn','plnt','passos'];let currentRoom='bcc1',view='room',currentDay=19;
frame.addEventListener('load',()=>{frame.style.visibility='visible';});
function roomLabel(room){return room==='passos'?'PM':room==='bcchl'?'BCC HL':room.toUpperCase();}
function chooseRoom(room){currentRoom=rooms.includes(room)?room:'bcc1';view='room';roomButtons.hidden=false;dayButtons.hidden=true;toggle.querySelector('span').textContent='POR SALA';toggle.setAttribute('aria-label','Mudar para grelha por dia');document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.room===currentRoom)));frame.style.visibility='hidden';frame.src=currentRoom+'.html?v=20261015-current-records';frame.title='Mapa '+roomLabel(currentRoom);history.replaceState(null,'','#'+currentRoom);}
function chooseDay(day){currentDay=Math.max(19,Math.min(28,Number(day)||19));view='day';roomButtons.hidden=true;dayButtons.hidden=false;toggle.querySelector('span').textContent='POR DIA';toggle.setAttribute('aria-label','Mudar para grelha por sala');dayButtons.replaceChildren(...Array.from({length:10},(_,i)=>{const d=19+i,b=document.createElement('button');b.type='button';b.textContent=d+' nov.';b.setAttribute('aria-pressed',String(d===currentDay));b.onclick=()=>chooseDay(d);return b;}));frame.style.visibility='hidden';frame.src='day.html?day='+currentDay+'&v=20261015-current-records';frame.title='Grelha por dia · '+currentDay+' novembro';history.replaceState(null,'','#day-'+currentDay);}
toggle.onclick=()=>view==='room'?chooseDay(currentDay):chooseRoom(currentRoom);document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>chooseRoom(b.dataset.room));
const hash=location.hash.slice(1);if(hash.startsWith('day-'))chooseDay(hash.slice(4));else chooseRoom(hash);
</script></body></html>
