<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PPD26 - Grelha</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="theme-color" content="#ff3eb5"><link rel="stylesheet" href="theme.css?v=20261107-pdf-detalhes"><style>.shell nav .shell-title{cursor:default}.shell nav .shell-title:hover{text-decoration:none}</style></head><body class="shell"><nav aria-label="Navegação da grelha"><div class="brand"><span class="brand-name">Porto/Post/Doc 2026</span><span class="brand-bird" role="img" aria-label="Pássaro da edição 2026 do Porto/Post/Doc"></span></div><div class="shell-title">GRELHA <span>POR SALA</span></div><div class="room-buttons" id="roomButtons"><button data-room="bcc1">BCC1</button><button data-room="bcc2">BCC2</button><button data-room="bcchl">BCC HL</button><button data-room="tmmcn">TMMCN</button><button data-room="plnt">PLNT</button><button data-room="passos">PM</button><button data-room="braga">Braga</button></div><div class="day-buttons" id="dayButtons" hidden></div></nav><iframe id="map" title="Mapa de sessões"></iframe><script>
const frame=document.getElementById('map'),rooms=['bcc1','bcc2','bcchl','tmmcn','plnt','passos','braga'];
frame.addEventListener('load',()=>{frame.style.visibility='visible';});
function roomLabel(room){return room==='braga'?'Braga':room==='passos'?'PM':room==='bcchl'?'BCC HL':room.toUpperCase();}
function chooseRoom(room){const selected=rooms.includes(room)?room:'bcc1';document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.room===selected)));frame.style.visibility='hidden';frame.src=selected+'.html?readonly=1&v=20261107-pdf-detalhes';frame.title='Mapa '+roomLabel(selected);history.replaceState(null,'',location.pathname+location.search+'#'+selected);}
document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>chooseRoom(b.dataset.room));chooseRoom(location.hash.slice(1));
</script></body></html>
