function renderSectionLegend(){const legend=$('sectionLegend');legend.replaceChildren();const sections=[...new Set(sessions.map(s=>s.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));for(const name of sections){const active=activeSectionFilter===name;const key=document.createElement('button');key.type='button';key.className='section-key'+(sectionInitials(name)==='CIMCM'?' section-key-wide':'');key.textContent=sectionInitials(name);key.style.setProperty('--section-color',name==='Clube'?'#0c2c4d':sectionColor(name));key.dataset.tooltip=name;key.title=name;key.setAttribute('aria-label',(active?'Remover filtro: ':'Filtrar por: ')+name);key.setAttribute('aria-pressed',String(active));key.onclick=()=>{activeSectionFilter=active?'':name;excludedSections.clear();render();};const group=document.createElement('span');group.className='section-filter-group';const minus=document.createElement('button');minus.type='button';minus.className='section-exclude';minus.textContent='−';const excluded=excludedSections.has(name);minus.setAttribute('aria-pressed',String(excluded));minus.title=(excluded?'Voltar a incluir: ':'Excluir: ')+name;minus.setAttribute('aria-label',minus.title);minus.onclick=()=>{activeSectionFilter='';if(excludedSections.has(name))excludedSections.delete(name);else excludedSections.add(name);render();};group.append(minus,key);legend.append(group);}}

 if(!dailyMode){const axis=document.createElement('div');axis.className='axis';axis.style.height=height+'px';for(let t=minTime;t<=maxTime;t+=15){const el=document.createElement('span');el.className='tick'+(t%60?' tick-minor':'');el.style.top=(t-minTime)*1.6+'px';if(t===minTime)el.style.transform='none';if(t===maxTime)el.style.transform='translateY(-100%)';el.textContent=time(t);axis.append(el);}$('calendar').append(axis);}
 for(let day=(dailyMode?dailyDay:19);day<=(dailyMode?dailyDay:28);day++){const lane=document.createElement('div');lane.className='lane';lane.dataset.day=day;lane.style.height=height+'px';for(let t=minTime;t<maxTime;t+=60){const line=document.createElement('div');line.className='hourline'+(t===1440?' midnight-line':'');line.style.top=(t-minTime)*1.6+'px';lane.append(line);}const items=visibleSessions.filter(s=>s.day===day).sort((a,b)=>a.start-b.start);let groups=[];for(const s of items){let g=groups.at(-1);if(!g||s.start>=g.end){g={items:[],end:0};groups.push(g);}g.items.push(s);g.end=Math.max(g.end,s.start+total(s));}

async function createSession(){if(readOnlyMode)return;if(!connected||busy){notify('Espera pela ligação ao servidor antes de criar uma sessão.');return;}const day=Number($('newDay').value),timeValue=$('newStart').value,club=$('newClub')?.checked===true,presenter=$('newPresenter').value.trim(),presentationMinutes=club?0:Number($('newPresentationMinutes').value),section=club?'Evento':$('newSection').value.trim(),sessionTitle=$('newTitle').value.trim(),qaName=club?'':$('newQaName').value.trim(),notes=club?$('newClubNotes').value.trim():'';const match=/^(\d{2}):(\d{2})$/.exec(timeValue||'');if(!match||Number(match[2])%15){$('newStart').focus();notify('Indica uma hora em intervalos de 15 minutos.');return;}if(!sessionTitle){$('newTitle').focus();notify('Indica o nome da sessão ou do evento.');return;}if(!section){$('newSection').focus();notify('Indica a secção da sessão.');return;}if(!Number.isInteger(presentationMinutes)||presentationMinutes<0||presentationMinutes>120){$('newPresentationMinutes').focus();notify('Indica uma duração de apresentação entre 0 e 120 minutos.');return;}const films=[];if(club){const duration=Number($('newClubDuration').value);if(!Number.isInteger(duration)||duration<1||duration>720){$('newClubDuration').focus();notify('Indica uma duração entre 1 e 720 minutos.');return;}films.push([sessionTitle,duration]);}else{for(const row of $('newFilmFields').querySelectorAll('.film-row')){const name=row.querySelector('input[type=text]').value.trim(),duration=Number(row.querySelector('input[type=number]').value);if(!name||!Number.isInteger(duration)||duration<1||duration>720){row.querySelector('input').focus();notify('Indica o título e a duração de cada filme.');return;}films.push([name,duration]);}}if(!films.length){notify('Adiciona pelo menos um filme.');return;}busy=true;$('storage').textContent='A criar sessão…';try{const saved=await remote.create({day,start:Number(match[1])*60+Number(match[2]),name:section,sessionTitle,films,presentationMinutes,qaName,c
