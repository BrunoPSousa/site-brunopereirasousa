<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grelha por dia · Porto/Post/Doc 2026</title><link rel="stylesheet" href="theme.css?v=20261015-thin-session-borders"></head><body class="day-view"><div class="day-toolbar"><label>Zoom <select id="zoom"><option value="0.528">73%</option><option value="0.72" selected>100%</option></select></label><span id="dayCount"></span></div><main class="daily-calendar"><div class="daily-axis" id="axis"></div><section class="daily-room"><header><strong>BCC1</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="BCC1 · sessões do dia"></iframe></section><section class="daily-room"><header><strong>BCC2</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="BCC2 · sessões do dia"></iframe></section><section class="daily-room"><header><strong>BCC HL</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="BCC HL · sessões do dia"></iframe></section><section class="daily-room"><header><strong>TMMCN</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="TMMCN · sessões do dia"></iframe></section><section class="daily-room"><header><strong>PLNT</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="PLNT · sessões do dia"></iframe></section><section class="daily-room"><header><strong>PM</strong><div><button data-action="edit">Editar grelha</button><button data-action="add" hidden>Adicionar sessão</button><button data-action="export">Exportar PDF</button></div></header><iframe title="PM · sessões do dia"></iframe></section></main><script>
const params=new URLSearchParams(location.search),day=Math.max(19,Math.min(28,Number(params.get('day'))||19)),rooms=['bcc1','bcc2','bcchl','tmmcn','plnt','passos'];document.title=`Grelha por dia · ${day} novembro`;
const axis=document.getElementById('axis'),calendar=document.querySelector('.daily-calendar'),zoomSelect=document.getElementById('zoom');function applyZoom(value){const scale=Number(value);axis.style.height=(46+1488*scale)+'px';calendar.style.setProperty('--daily-scale',scale);axis.replaceChildren();for(let t=600;t<=1530;t+=15){const tick=document.createElement('span');tick.className='daily-tick'+(t%60?' minor':'');tick.style.top=(46+(t-600)*1.6*scale)+'px';if(t===1530)tick.style.transform='translateY(-100%)';tick.textContent=`${String(Math.floor(t%1440/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;axis.append(tick);}columns.forEach(c=>{const frame=c.querySelector('iframe');frame.style.height=(1488*scale)+'px';frame.contentWindow.postMessage({type:'room-zoom',value:String(value)},location.origin);});}
const columns=[...document.querySelectorAll('.daily-room')];columns.forEach((column,index)=>{const room=rooms[index],frame=column.querySelector('iframe'),edit=column.querySelector('[data-action=edit]'),add=column.querySelector('[data-action=add]');frame.src=`${room}.html?daily=1&day=${day}&v=20261015-current-records`;frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'room-zoom',value:zoomSelect.value},location.origin));edit.onclick=()=>{const next=edit.getAttribute('aria-pressed')!=='true';edit.setAttribute('aria-pressed',String(next));edit.textContent=next?'Terminar edição':'Editar grelha';add.hidden=!next;frame.contentWindow.postMessage({type:'room-edit',value:next},location.origin);};add.onclick=()=>frame.contentWindow.postMessage({type:'room-add'},location.origin);column.querySelector('[data-action=export]').onclick=()=>frame.contentWindow.postMessage({type:'room-export'},location.origin);});
zoomSelect.onchange=e=>applyZoom(e.target.value);document.getElementById('dayCount').textContent=`${day} novembro · grelha por dia`;applyZoom(zoomSelect.value);
</script></body></html>
