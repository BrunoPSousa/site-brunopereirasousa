<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grelha por dia · Porto/Post/Doc 2026</title><link rel="stylesheet" href="theme.css?v=20261017-20261022-braga"></head><body class="day-view"><div class="day-toolbar"><label>Zoom <select id="zoom"><option value="0.528">73%</option><option value="0.72" selected>100%</option></select></label><span id="dayCount"></span></div><main class="daily-calendar"><div class="daily-axis" id="axis"></div><section class="daily-room"><header><strong>Batalha Centro de Cinema — Sala 1</strong></header><iframe title="BCC1 · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Batalha Centro de Cinema — Sala 2</strong></header><iframe title="BCC2 · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Batalha Centro de Cinema — Bar High Life</strong></header><iframe title="BCC HL · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Teatro Municipal de Matosinhos Constantino Nery</strong></header><iframe title="TMMCN · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Planetário do Porto — Centro Ciência Viva</strong></header><iframe title="PLNT · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Cinema Passos Manuel — Auditório</strong></header><iframe title="PM · sessões do dia"></iframe></section><section class="daily-room"><header><strong>Braga</strong></header><iframe title="Braga · sessões do dia"></iframe></section></main><script>

const axis=document.getElementById('axis'),calendar=document.querySelector('.daily-calendar'),zoomSelect=document.getElementById('zoom');function applyZoom(value){const scale=Number(value);axis.style.height=(1488*scale)+'px';axis.style.setProperty('--daily-quarter',(24*scale)+'px');calendar.style.setProperty('--daily-scale',scale);axis.replaceChildren();for(let t=600;t<=1530;t+=15){const tick=document.createElement('span');tick.className='daily-tick'+(t%60?' minor':'');tick.style.top=(46+(t-600)*1.6*scale)+'px';if(t===1530)tick.style.transform='translateY(-100%)';tick.textContent=`${String(Math.floor(t%1440/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;axis.append(tick);}columns.forEach(c=>{const frame=c.querySelector('iframe');frame.style.height=(1488*scale)+'px';frame.contentWindow.postMessage({type:'room-zoom',value:String(value)},location.origin);});}
const columns=[...document.querySelectorAll('.daily-room')];columns.forEach((column,index)=>{const room=rooms[index],frame=column.querySelector('iframe');frame.src=`${room}.html?daily=1&day=${day}&v=20261023-presenter-format`;frame.addEventListener('load',()=>frame.contentWindow.postMessage({type:'room-zoom',value:zoomSelect.value},location.origin));});
