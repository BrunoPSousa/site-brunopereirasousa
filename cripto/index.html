<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carteira Cripto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f13;
      color: #e8e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
    }

    header p {
      font-size: 0.82rem;
      color: #666;
      margin-top: 0.3rem;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* Total card */
    .total-card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 16px;
      padding: 1.8rem 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .total-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666;
    }

    .total-value {
      font-size: 2.6rem;
      font-weight: 700;
      color: #fff;
      margin: 0.4rem 0 0.2rem;
      letter-spacing: -0.02em;
    }

    .total-updated {
      font-size: 0.75rem;
      color: #555;
    }

    /* Holdings list */
    .holdings {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .holding-card {
      background: #1a1a24;
      border: 1px solid #2a2a38;
      border-radius: 12px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .holding-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #25253a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      flex-shrink: 0;
      color: #a78bfa;
      overflow: hidden;
    }

    .holding-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .holding-info {
      flex: 1;
    }

    .holding-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }

    .holding-qty {
      font-size: 0.78rem;
      color: #666;
      margin-top: 0.1rem;
    }

    .holding-values {
      text-align: right;
    }

    .holding-total {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }

    .holding-price {
      font-size: 0.75rem;
      color: #666;
      margin-top: 0.1rem;
    }

    .holding-error {
      font-size: 0.75rem;
      color: #ff6b6b;
    }

    .empty-state {
      text-align: center;
      color: #444;
      font-size: 0.9rem;
      padding: 1.5rem 0;
    }

    .holding-details {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.3rem 0.6rem;
      margin-top: 0.3rem;
    }
    .holding-platform {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 20px;
      min-height: 20px;
      color: #a5a5b5;
      font-size: 0.65rem;
    }
    .holding-platform img { width: 20px; height: 20px; object-fit: contain; border-radius: 4px; }
    .holding-info { min-width: 0; display: flex; align-items: center; gap: 1rem; }
    .holding-copy { min-width: 0; }
    @media (max-width: 420px) {
      .holding-card { padding: 0.85rem; gap: 0.6rem; }
      .holding-name, .holding-total { font-size: 0.85rem; }
      .holding-info { gap: 0.5rem; }
      .holding-platform { flex-basis: 20px; }
      .holding-platform img { width: 20px; height: 20px; }
    }
    .holding-card { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 0.8rem 1rem; }
    .holding-metrics {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      border-top: 1px solid #2a2a38;
      padding-top: 0.75rem;
    }
    .metric-label { display: block; font-size: 0.7rem; color: #9999ab; margin-bottom: 0.35rem; }
    .holding-change { text-align: right; }
    .change-value { font-size: 1rem; font-weight: 600; color: #9999ab; }
    .change-value.positive { color: #5cdda5; }
    .change-value.negative { color: #ff8585; }
    .change-hint { font-size: 0.65rem; color: #9999ab; margin-top: 0.2rem; max-width: 150px; }
    @media (max-width: 420px) {
      .holding-card { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 0.65rem; }
      .holding-icon { width: 32px; height: 32px; }
      .holding-info { gap: 0.4rem; }
      .holding-metrics { gap: 0.5rem; grid-template-columns: minmax(0, 1fr) 110px; }
    }
    .holding-card { padding: 0.75rem 1rem; row-gap: 0.5rem; }
    .holding-metrics { padding-top: 0.45rem; }
    .holding-cost, .holding-change { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .holding-change { justify-content: flex-end; }
    .holding-metrics .metric-label { margin: 0; font-size: 0.65rem; }
    .cost-value { font-size: 0.8rem; color: #d1d1df; }
    .holding-metrics .change-value { font-size: 0.85rem; }
    .portfolio-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; padding-top: 0.8rem; border-top: 1px solid #2a2a38; }
    .summary-value { font-size: 1.1rem; font-weight: 600; }
    .summary-note { color: #9999ab; font-size: 0.7rem; margin-top: 0.35rem; }
    .summary-note:empty { display: none; }
    @media (max-width: 420px) {
      .holding-cost, .holding-change { gap: 0.2rem; flex-direction: column; }
      .holding-change { align-items: flex-end; }
      .summary-value { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Carteira Cripto</h1>
      <p>Valor atual das tuas posições</p>
    </header>

    <div class="total-card">
      <div class="total-label">Valor Total</div>
      <div class="total-value" id="totalValue">€ —</div>
      <div class="total-updated" id="totalUpdated">A carregar...</div>
      <div class="portfolio-metrics">
        <div><span class="metric-label">Custo total de compra</span><span class="summary-value" id="portfolioCost">—</span></div>
        <div><span class="metric-label">Variação face à compra</span><span class="summary-value change-value" id="portfolioChange">—</span></div>
      </div>
      <div class="summary-note" id="portfolioNote"></div>
    </div>

    <div class="holdings" id="holdingsList"></div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, onSnapshot, collection
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // --- Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyBX2_w_7Xj5hsZ_EwSgDwsBmgsQFsLrRA0",
      authDomain: "brunopereirasousa-lista.firebaseapp.com",
      projectId: "brunopereirasousa-lista",
      storageBucket: "brunopereirasousa-lista.firebasestorage.app",
      messagingSenderId: "1039062641862",
      appId: "1:1039062641862:web:1ccaa4af5352a366e9bbc7"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    const holdingsCol = collection(db, "cripto_holdings");

    // --- Metadados das moedas ---
    const COIN_META = {
      'bitcoin':     { name: 'Bitcoin',   symbol: 'BTC',  fallback: '₿' },
      'ethereum':    { name: 'Ethereum',  symbol: 'ETH',  fallback: 'Ξ' },
      'avalanche-2': { name: 'Avalanche', symbol: 'AVAX', fallback: 'A' },
      'ripple':      { name: 'XRP',       symbol: 'XRP',  fallback: 'X' },
      'aave':        { name: 'Aave',      symbol: 'AAVE', fallback: 'A' },
      'solana':      { name: 'Solana',    symbol: 'SOL',  fallback: 'S' },
    };

    // --- State ---
    let holdings  = {}; // { documentId: { coinId, qty, platform } }
    let prices    = {}; // { coinId: { eur: number } }
    const PLATFORMS = { bitstamp: 'Bitstamp', coinbase: 'Coinbase' };
    let priceRequest = null;
    let priceError = false;
    const PRICE_MAX_AGE = 5 * 60_000;
    const KRAKEN_PAIRS = {
      bitcoin: 'XXBTZEUR', ethereum: 'XETHZEUR', 'avalanche-2': 'AVAXEUR',
      ripple: 'XXRPZEUR', aave: 'AAVEEUR', solana: 'SOLEUR',
    };

    // --- Firestore: escuta em tempo real ---
    onSnapshot(holdingsCol, snapshot => {
      holdings = {};
      snapshot.forEach(d => {
        const data = d.data();
        holdings[d.id] = {
          coinId: data.coinId || d.id,
          qty: Number(data.qty),
          costTotal: typeof data.costTotal === 'number' && Number.isFinite(data.costTotal) && data.costTotal >= 0 ? data.costTotal : null,
          platform: Object.hasOwn(PLATFORMS, data.platform) ? data.platform : '',
        };
      });
      render();
      // As quantidades não alteram os preços; evita pedidos duplicados.
    });

    // --- Preços em EUR: Kraken, com CoinGecko como alternativa ---
    async function fetchJson(url) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10_000);
      try {
        const res = await fetch(url, { signal: controller.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timeout);
      }
    }

    function fetchPrices() {
      if (priceRequest) return priceRequest;
      priceError = false;
      priceRequest = (async () => {
        const next = {};
        try {
          const data = await fetchJson('https://api.kraken.com/0/public/Ticker?pair=XBTEUR,ETHEUR,AVAXEUR,XRPEUR,AAVEEUR,SOLEUR');
          if (data.error?.length || !data.result) throw new Error('Resposta Kraken inválida');
          for (const [id, pair] of Object.entries(KRAKEN_PAIRS)) {
            const eur = Number(data.result[pair]?.c?.[0]);
            if (Number.isFinite(eur) && eur > 0) {
              next[id] = { eur, at: Date.now(), source: 'Kraken' };
            }
          }
        } catch (error) {
          console.warn('Não foi possível obter preços da Kraken:', error);
        }
        const missing = Object.keys(COIN_META).filter(id => !next[id]);
        if (missing.length) {
          try {
            const data = await fetchJson(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&ids=${missing.join(',')}&sparkline=false`);
            if (!Array.isArray(data)) throw new Error('Resposta CoinGecko inválida');
            for (const coin of data) {
              if (missing.includes(coin.id) && typeof coin.current_price === 'number' &&
                  Number.isFinite(coin.current_price) && coin.current_price > 0) {
                next[coin.id] = { eur: coin.current_price, at: Date.now(), source: 'CoinGecko' };
              }
            }
          } catch (error) {
            console.warn('Não foi possível obter preços do CoinGecko:', error);
          }
        }
        Object.assign(prices, next);
        priceError = Object.keys(COIN_META).some(id => !next[id]);
      })().finally(() => {
        priceRequest = null;
        render();
      });
      render();
      return priceRequest;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    // --- Formatação ---
    function formatEur(value) {
      if (value === null || value === undefined) return '—';
      return new Intl.NumberFormat('pt-PT', {
        style: 'currency',
        currency: 'EUR',
        maximumFractionDigits: value < 1 ? 6 : 2,
      }).format(value);
    }

    function formatQty(qty, symbol) {
      return `${parseFloat(qty).toLocaleString('pt-PT', { maximumFractionDigits: 8 })} ${symbol}`;
    }

    function purchaseChange(value, cost) {
      if (!Number.isFinite(value) || !Number.isFinite(cost) || cost <= 0) return null;
      return (value - cost) / cost * 100;
    }

    function formatChange(change) {
      return new Intl.NumberFormat('pt-PT', {
        style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2,
        signDisplay: 'exceptZero'
      }).format(change / 100);
    }

    // --- Render ---
    function render() {
      const list      = document.getElementById('holdingsList');
      const totalEl   = document.getElementById('totalValue');
      const updatedEl = document.getElementById('totalUpdated');

      const entries = Object.entries(holdings).sort(([, a], [, b]) =>
        a.coinId.localeCompare(b.coinId) || a.platform.localeCompare(b.platform));

      const costEl = document.getElementById('portfolioCost');
      const changeEl = document.getElementById('portfolioChange');
      const noteEl = document.getElementById('portfolioNote');
      changeEl.className = 'summary-value change-value';
      noteEl.textContent = '';
      if (entries.length === 0) {
        costEl.textContent = formatEur(0);
        changeEl.textContent = '—';
        list.innerHTML = '<div class="empty-state">Ainda não tens nenhuma posição.</div>';
        totalEl.textContent = '€ 0,00';
        updatedEl.textContent = '';
        return;
      }

      let total = 0;
      let allPriced = true;
      const nowMs = Date.now();

      list.innerHTML = entries.map(([holdingId, { coinId, qty, platform, costTotal }]) => {
        const meta      = COIN_META[coinId] || { name: coinId, symbol: coinId.toUpperCase(), fallback: '?' };
        const priceData = prices[coinId];
        const price     = priceData && nowMs - priceData.at < PRICE_MAX_AGE ? priceData.eur : null;
        const value     = price !== null ? price * qty : null;

        if (value !== null) total += value;
        else allPriced = false;

        const change = purchaseChange(value, costTotal);
        const iconHtml = Object.hasOwn(COIN_META, coinId)
          ? `<img src="./icons/${meta.symbol.toLowerCase()}.svg" alt="Logótipo ${meta.name}" width="38" height="38" />`
          : '?';

        return `
          <div class="holding-card">
            <div class="holding-icon">${iconHtml}</div>
            <div class="holding-info">
              <div class="holding-copy">
              <div class="holding-name">${escapeHtml(meta.name)} <span style="color:#666;font-weight:400;font-size:0.8rem">${escapeHtml(meta.symbol)}</span></div>
              <div class="holding-details">
                <span class="holding-qty">${escapeHtml(formatQty(qty, meta.symbol))}</span>
              </div>
              </div>
              <span class="holding-platform" title="${PLATFORMS[platform] || 'Plataforma por definir'}">
                ${PLATFORMS[platform] ? `<img src="./icons/${platform}-favicon.png" alt="${PLATFORMS[platform]}" />` : 'Plataforma por definir'}
              </span>
            </div>
            <div class="holding-values">
              <div class="holding-total">${value !== null ? formatEur(value) : '<span class="holding-error">sem preço</span>'}</div>
              <div class="holding-price">${price !== null ? formatEur(price) + ' / unid.' : ''}</div>
            </div>
            <div class="holding-metrics">
              <div class="holding-cost">
                <span class="metric-label">Custo total</span>
                <span class="cost-value">${costTotal === null ? '—' : formatEur(costTotal)}</span>
              </div>
              <div class="holding-change">
                <div class="metric-label">Variação face à compra</div>
                <div class="change-value ${change > 0 ? 'positive' : change < 0 ? 'negative' : ''}">${change === null ? '—' : formatChange(change)}</div>
                ${change === null ? `<div class="change-hint">${costTotal === null ? 'Custo não definido' : costTotal === 0 ? 'Sem percentagem para custo zero' : 'Preço indisponível'}</div>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Nunca apresentar um subtotal ou dados em falta como o valor total.
      totalEl.textContent = allPriced ? formatEur(total) : '—';
      const allCostsKnown = entries.every(([, h]) => Number.isFinite(h.costTotal) && h.costTotal >= 0);
      const totalCost = allCostsKnown ? entries.reduce((sum, [, h]) => sum + h.costTotal, 0) : null;
      const portfolioChange = allCostsKnown && allPriced ? purchaseChange(total, totalCost) : null;
      costEl.textContent = totalCost === null ? '—' : formatEur(totalCost);
      changeEl.textContent = portfolioChange === null ? '—' : formatChange(portfolioChange);
      if (portfolioChange > 0) changeEl.classList.add('positive');
      if (portfolioChange < 0) changeEl.classList.add('negative');
      if (!allCostsKnown) noteEl.textContent = 'Há posições sem custo definido; a variação global não está disponível.';
      else if (!allPriced) noteEl.textContent = 'A variação global aguarda preços atualizados.';
      else if (totalCost === 0) noteEl.textContent = 'Não é possível calcular uma percentagem com custo total zero.';
      const available = entries.map(([, holding]) => prices[holding.coinId]).filter(Boolean);
      const oldest = available.length ? Math.min(...available.map(p => p.at)) : null;
      const time = oldest ? new Date(oldest).toLocaleTimeString('pt-PT', {
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      }) : '';
      const sources = [...new Set(available.map(p => p.source))].join(' / ');
      if (priceRequest) {
        updatedEl.textContent = 'A atualizar preços…';
      } else if (!allPriced) {
        updatedEl.textContent = 'Preços indisponíveis. Não é possível calcular o total. Nova tentativa automática em breve.';
      } else if (priceError) {
        updatedEl.textContent = `Falha na atualização. Últimos preços obtidos às ${time} · ${sources}`;
      } else {
        updatedEl.textContent = `Preços obtidos às ${time} · ${sources}`;
      }
    }

    // --- Init: buscar preços imediatamente ---
    fetchPrices();

    // Auto-refresh a cada 60 segundos
    setInterval(fetchPrices, 60_000);
  </script>
</body>
</html>
