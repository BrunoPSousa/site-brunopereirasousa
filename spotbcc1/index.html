<!doctype html><html lang="pt"><head><base href="/grelha/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PPD26 - BCC1</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="512x512" href="favicon.png"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><meta name="theme-color" content="#ff3eb5"><link rel="stylesheet" href="theme.css?v=20261116-spot-rooms"><style>.shell nav .shell-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,2.7vw,32px);font-weight:700;letter-spacing:-0.5px}</style></head><body class="shell"><nav aria-label="Navegação da grelha"><div class="brand"><span class="brand-name">Porto/Post/Doc 2026</span><span class="brand-bird" role="img" aria-label="Pássaro da edição 2026 do Porto/Post/Doc"></span></div><div class="shell-title">GRELHA PARA SPOTTING</div><div class="room-buttons" id="roomButtons"><button data-room="bcc1">BCC1</button></div></nav><iframe id="map" title="Mapa de sessões"></iframe><script>
const rooms=['bcc1'],frame=document.getElementById('map');
function chooseRoom(room){
 const selected=rooms.includes(room)?room:rooms[0];
 document.querySelectorAll('[data-room]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.room===selected)));
 frame.style.visibility='hidden';
 frame.src=selected+'.html?readonly=1&spotHideQa=1&spotStart=15&v=20261116-spot-tony-aviso';
 frame.title='Mapa '+(selected==='passos'?'PM':selected==='bcchl'?'BCC HL':selected.toUpperCase());
 history.replaceState(null,'',location.pathname+location.search+'#'+selected);
}
frame.addEventListener('load',()=>{const style=frame.contentDocument.createElement('style');style.textContent='.section-badge{background:transparent!important;color:transparent!important;min-width:0!important;padding:0!important}.spotting-marker{display:none!important}.session{background-image:none!important;background-color:#ededed!important}.session:has(.spotting-marker){background-color:#00e600!important}#spottingDetails{display:none!important}.qa-filter,.section-legend{display:none!important}.session:not(.club-session) .presentation,.session:not(.club-session) .category,.session:not(.club-session) .estimate-icon{display:none!important}';frame.contentDocument.head.append(style);frame.style.visibility='visible';});
document.querySelectorAll('[data-room]').forEach(button=>button.onclick=()=>chooseRoom(button.dataset.room));
window.addEventListener('hashchange',()=>chooseRoom(location.hash.slice(1)));
chooseRoom(location.hash.slice(1));
</script></body></html>
